[project]
name = "ledger"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ferreirasara-cpu", email = "ferreira.sara@student.ie.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "rich>=15.0.0",
    "sqlalchemy>=2.1.9",
]

[project.scripts]
ledger = "ledger.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
